name: Fe checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned official Fe compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/argotorg/fe/releases/download/v26.7.0/fe_linux_amd64 \
            --output "$RUNNER_TEMP/fe"
          printf '%s  %s\n' \
            '4ef2b818e260f0ba0b0af4bd78468dda589dc4949503fffaef25d8188e5107d5' \
            "$RUNNER_TEMP/fe" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/fe"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: fe --version
      - run: fe fmt --check
      - run: fe check
      - run: fe test
      - run: fe build
      - run: fe test --backend wasm
      - run: fe build --backend wasm --out-dir demo/engine
      - run: node scripts/demo.mjs --all --verify
      - run: node scripts/verify.mjs
      - run: node --test scripts/inspection.test.mjs
      - run: node --test scripts/cohort.test.mjs
      - run: node --test scripts/proxy-context.test.mjs
      - run: node scripts/inspect.mjs --replay reports/gang-router.json
